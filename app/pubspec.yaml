name: mini_sudoku
description: "Mini Sudoku, the sample app of flutter-store-kit."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  firebase_core: ^4.1.1
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_auth: ^6.6.1
  http: ^1.6.0
  unity_ads_plugin: ^0.5.0
  app_tracking_transparency: ^2.0.7
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  in_app_review: ^2.0.12
  firebase_remote_config: ^6.6.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4
  in_app_purchase_platform_interface: ^1.4.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1A3D"
  adaptive_icon_foreground: assets/icon/icon.png
